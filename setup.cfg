[flake8]
max-line-length = 88

# Exclude directories and files
exclude = 
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    env,
    .env,
    build,
    dist

# Ignore specific errors/warnings
ignore =
    E203,  # Whitespace before ':'
    W503,  # Line break before binary operator
    E231,  # Missing whitespace after ','

max-complexity = 10

select = C,E,F,W,B,B950

statistics = True
count = True

# Per-file ignore patterns
per-file-ignores =
    __init__.py: F401
    */settings.py: E501

# Docstring style checking
docstring-convention = google 